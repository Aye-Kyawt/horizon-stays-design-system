<!--
  The type tokens name Inter (Latin) and Padauk (Myanmar). Loading both means
  the typography specimens render in the real faces instead of a system
  fallback. If the network is unavailable the pages still work — every
  font-family token carries a generic fallback at the point of use.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Padauk:wght@400;700&display=swap"
  rel="stylesheet"
/>

<!--
  Icons come from Material Symbols (CLAUDE.md: "Install and import material
  symbols from https://fonts.google.com/icons"). Rounded is the family whose
  corners match the card set. The variable axes are requested so a component can
  drive the FILL axis — .iconBtn switches its heart between solid and outline
  that way. This stylesheet is also where the icon font-family is named: the
  Google CSS defines the `.material-symbols-rounded` class, so no component
  stylesheet has to hardcode a font name the token system has no token for.
  `display=block` is Google's own recommendation for icon fonts and is the
  fallback that matters here — it hides the glyph slot while the font loads
  rather than flashing the ligature text ("favorite") in its place. If the
  network is unavailable the buttons still render, stay focusable and stay
  clickable; the glyph box is a fixed size with overflow clipped, so a missing
  font never reflows the card.
-->
<link
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
  rel="stylesheet"
/>
